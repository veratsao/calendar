<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日課便帖 | 雲端同步增強版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', 'Zen Maru Gothic', sans-serif;
            background-color: #F7F5F0;
            color: #4A4A4A;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 拖曳樣式 */
        .task-card {
            touch-action: none;
            cursor: grab;
        }
        .task-card:active {
            cursor: grabbing;
        }
        .task-card.dragging {
            opacity: 0.35 !important;
        }
        
        .drag-clone {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.9;
            transform: scale(1.05);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
            transition: none;
        }

        .drag-over-target {
            background-color: #EAE6DF !important;
            border-style: dashed !important;
            border-color: #8A9A86 !important;
        }

        @media print {
            header, aside, .no-print, button, #sidebar-overlay { display: none !important; }
            body { background-color: #ffffff !important; color: #000000 !important; padding: 0 !important; margin: 0 !important; }
            main { max-width: 100% !important; width: 100% !important; padding: 5mm !important; margin: 0 !important; }
            .calendar-control-row { border: none !important; box-shadow: none !important; padding: 0 0 10px 0 !important; justify-content: center !important; }
            #calendar-grid { min-height: 720px !important; height: auto !important; page-break-inside: avoid; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-[#8A9A86] selection:text-white">

    <!-- Header 頂部導航 -->
    <header class="bg-white/90 backdrop-blur-md border-b border-[#E6E2DC] sticky top-0 z-30 px-4 py-3 flex justify-between items-center shadow-2xs">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar(true)" class="text-[#7A746B] hover:text-[#4A4A4A] p-2 rounded-lg hover:bg-[#F7F5F0] transition-colors focus:outline-none">
                <i class="fa-solid fa-sliders text-lg"></i>
            </button>
            <h1 class="text-lg font-medium tracking-widest text-[#5C5750] font-['Zen_Maru_Gothic'] flex items-center gap-2">
                <span>日課便帖</span>
                <span id="daily-completion-badge" class="text-xs bg-[#8A9A86]/10 text-[#8A9A86] font-semibold px-2.5 py-0.5 rounded-full border border-[#8A9A86]/20">0% 完成</span>
                <span id="cloud-status-indicator" class="text-xs text-gray-400" title="雲端同步狀態">
                    <i class="fa-solid fa-cloud"></i>
                </span>
            </h1>
        </div>
        
        <div class="flex items-center gap-2">
            <div class="bg-[#F2EFEA] p-1 rounded-lg flex gap-1 text-xs font-medium">
                <button id="btn-device-mobile" onclick="switchDeviceMode('mobile')" class="px-2.5 py-1.5 rounded-md transition-all text-[#7A746B] hover:text-[#4A4A4A]">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                </button>
                <button id="btn-device-desktop" onclick="switchDeviceMode('desktop')" class="px-2.5 py-1.5 rounded-md transition-all text-[#7A746B] hover:text-[#4A4A4A]">
                    <i class="fa-solid fa-desktop"></i>
                </button>
            </div>

            <div class="bg-[#F2EFEA] p-1 rounded-lg flex gap-1 text-xs font-medium">
                <button id="btn-month-view" onclick="switchView('month')" class="px-3 py-1.5 rounded-md transition-all bg-white shadow-2xs text-[#4A4A4A]">月</button>
                <button id="btn-week-view" onclick="switchView('week')" class="px-3 py-1.5 rounded-md transition-all text-[#7A746B] hover:text-[#4A4A4A]">週</button>
            </div>
            
            <button onclick="window.print()" class="bg-white border border-[#E6E2DC] p-2 rounded-lg text-[#7A746B] hover:text-[#4A4A4A] hover:bg-[#F7F5F0] transition-colors shadow-2xs">
                <i class="fa-solid fa-print text-sm"></i>
            </button>
        </div>
    </header>

    <!-- 主內容區 -->
    <main id="main-container" class="flex-1 mx-auto w-full p-3 flex flex-col gap-3 pb-12 transition-all duration-300">
        
        <div class="calendar-control-row flex justify-between items-center bg-white px-4 py-2.5 rounded-xl border border-[#E6E2DC] shadow-2xs">
            <button onclick="navigateCalendar(-1)" class="no-print w-8 h-8 rounded-full hover:bg-[#F7F5F0] text-[#7A746B] flex items-center justify-center">
                <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>
            <div class="text-center">
                <h2 id="calendar-title" class="font-medium text-[#4A4A4A] tracking-wider text-base">2026年 09月</h2>
            </div>
            <button onclick="navigateCalendar(1)" class="no-print w-8 h-8 rounded-full hover:bg-[#F7F5F0] text-[#7A746B] flex items-center justify-center">
                <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
        </div>

        <div id="week-header-row" class="grid grid-cols-7 gap-1 text-center text-sm font-semibold text-[#8C867E] tracking-wider px-1">
            <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="text-[#B87C67]">六</div><div class="text-[#B87C67]">日</div>
        </div>

        <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 flex-1 min-h-[500px]">
            <!-- 動態渲染 -->
        </div>

    </main>

    <!-- 側邊 Drawer -->
    <div id="sidebar-overlay" onclick="toggleSidebar(false)" class="hidden fixed inset-0 bg-black/20 backdrop-blur-xs z-40 transition-opacity duration-300 opacity-0"></div>
    <aside id="sidebar" class="fixed top-0 bottom-0 left-0 w-[85%] max-w-sm bg-[#FBFBF9] border-r border-[#E6E2DC] z-50 transform -translate-x-full transition-transform duration-300 ease-out flex flex-col shadow-2xl">
        <div class="p-4 border-b border-[#E6E2DC] flex justify-between items-center bg-white">
            <h3 class="font-medium text-[#4A4A4A] flex items-center gap-2 text-sm">
                <i class="fa-solid fa-sliders text-[#8A9A86]"></i> 偏好設定與雲端備份
            </h3>
            <button onclick="toggleSidebar(false)" class="text-[#7A746B] hover:text-[#4A4A4A] w-8 h-8 rounded-full flex items-center justify-center hover:bg-[#F7F5F0]">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="p-4 space-y-4 flex-1 overflow-y-auto">
            <!-- 雲端備份設定卡片 -->
            <div class="bg-white p-4 rounded-xl border border-[#E6E2DC] shadow-2xs space-y-3">
                <div class="text-xs font-medium text-[#7A746B] flex items-center gap-1.5">
                    <i class="fa-solid fa-cloud-arrow-up text-[#8A9A86]"></i> Google Apps Script 雲端自動同步
                </div>
                <input type="url" id="gas-url-input" placeholder="https://script.google.com/macros/s/AKfycbwXVzU7FjpDsQECrqFq7QseV9Nifhz7boG4_LMfNFMfW2kTBonSIKhqA40bLa9sUhcHrQ/exec" 
                       class="w-full text-xs p-2 border border-[#E6E2DC] rounded-lg focus:outline-none focus:border-[#8A9A86]">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="saveGasUrl()" class="bg-[#8A9A86] text-white py-1.5 px-2 rounded-lg text-xs hover:bg-[#788874]">
                        儲存網址
                    </button>
                    <button onclick="syncFromCloud()" class="bg-[#F7F5F0] border border-[#E6E2DC] text-[#5C5750] py-1.5 px-2 rounded-lg text-xs hover:bg-[#EAE6DF]">
                        從雲端載入
                    </button>
                </div>
            </div>

            <!-- 本地 JSON 備份卡片 -->
            <div class="bg-white p-4 rounded-xl border border-[#E6E2DC] shadow-2xs space-y-3">
                <div class="text-xs font-medium text-[#7A746B] flex items-center gap-1.5">
                    <i class="fa-solid fa-database text-[#8A9A86]"></i> 本地檔案備份與還原
                </div>
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button onclick="downloadBackup()" class="bg-[#F7F5F0] border border-[#E6E2DC] text-[#5C5750] py-2 px-2 rounded-lg text-xs hover:bg-[#EAE6DF] flex items-center justify-center gap-1 font-medium">
                        <i class="fa-solid fa-download text-[#8A9A86]"></i> 下載備份
                    </button>
                    <button onclick="triggerUploadBackup()" class="bg-[#F7F5F0] border border-[#E6E2DC] text-[#5C5750] py-2 px-2 rounded-lg text-xs hover:bg-[#EAE6DF] flex items-center justify-center gap-1 font-medium">
                        <i class="fa-solid fa-upload text-[#B87C67]"></i> 上傳還原
                    </button>
                </div>
                <input type="file" id="backup-file-input" accept=".json" class="hidden" onchange="handleUploadBackup(event)">
            </div>
        </div>
    </aside>

    <script>
        // --- 科目顏色對照表 (莫蘭迪色系) ---
        const SUBJECT_COLORS = {
            '國文': 'bg-[#F2E3E1] border-[#E8C5C1] text-[#7A4A46]',
            '英文': 'bg-[#E3EBF2] border-[#C2D4E3] text-[#41627E]',
            '數學': 'bg-[#E2F0D9] border-[#C3E2B2] text-[#3D632A]',
            '自然': 'bg-[#E5F2F0] border-[#C3E2DC] text-[#376860]',
            '社會': 'bg-[#FCF2E3] border-[#F8DCB8] text-[#7E5723]',
            '物理': 'bg-[#E8E6F2] border-[#CFCBE5] text-[#4F4673]',
            '化學': 'bg-[#F5E6F2] border-[#E8CBE5] text-[#73466F]',
            '歷史': 'bg-[#F7ECE1] border-[#EAD5C3] text-[#704D31]',
            '地理': 'bg-[#EAF0E6] border-[#D1E0C9] text-[#435E34]',
            'default': 'bg-[#F0F2EE] border-[#D6DDD4] text-[#4A554A] hover:border-[#8A9A86]'
        };

        let state = {
            currentDate: new Date(),
            viewMode: 'month',
            deviceMode: 'mobile',
            assignments: {},
            gasUrl: '',
            
            dragData: {
                assignId: null,
                fromDateStr: null,
                cloneEl: null,
                lastTargetCell: null
            }
        };

        function initStorage() {
            const localData = localStorage.getItem('muji_planner_ux_data');
            state.gasUrl = localStorage.getItem('muji_planner_gas_url') || '';
            if (state.gasUrl) {
                document.getElementById('gas-url-input').value = state.gasUrl;
            }

            if (localData) {
                try {
                    const parsed = JSON.parse(localData);
                    state.assignments = parsed.assignments || {};
                    state.deviceMode = parsed.deviceMode || 'mobile';
                } catch (e) { loadMockData(); }
            } else {
                loadMockData();
            }
            state.currentDate = new Date();
            saveToStorage(false); // 初始時不觸發雲端，避免覆蓋
            switchDeviceMode(state.deviceMode);
        }

        function saveToStorage(triggerCloud = true) {
            localStorage.setItem('muji_planner_ux_data', JSON.stringify({
                assignments: state.assignments,
                deviceMode: state.deviceMode
            }));
            updateCompletionBadge();

            if (triggerCloud && state.gasUrl) {
                syncToCloud();
            }
        }

        function loadMockData() {
            const todayStr = formatDateStr(new Date());
            state.assignments = {};
            state.assignments[todayStr] = [
                { id: 'assign-1', name: '數學: 拖曳至其他日期', done: false },
                { id: 'assign-2', name: '英文: 雙擊可修改內容', done: true }
            ];
            state.deviceMode = 'mobile';
        }

        // --- 科目顏色識別 ---
        function getSubjectColorClass(name, done) {
            if (done) return 'bg-[#EAE6DF] border-[#D6D2C9] text-[#B0A9A0] line-through decoration-1';
            
            for (let sub in SUBJECT_COLORS) {
                if (sub !== 'default' && (name.includes(sub) || name.startsWith(`[${sub}]`) || name.startsWith(`${sub}:`))) {
                    return SUBJECT_COLORS[sub];
                }
            }
            return SUBJECT_COLORS['default'];
        }

        // --- 雲端同步 GAS ---
        function saveGasUrl() {
            const url = document.getElementById('gas-url-input').value.trim();
            state.gasUrl = url;
            localStorage.setItem('muji_planner_gas_url', url);
            alert('Google Apps Script 網址已儲存！');
            if (url) syncToCloud();
        }

        function updateCloudStatus(status) {
            const el = document.getElementById('cloud-status-indicator');
            if (!el) return;
            if (status === 'syncing') el.className = 'text-xs text-amber-500 animate-pulse';
            else if (status === 'success') el.className = 'text-xs text-emerald-600';
            else if (status === 'error') el.className = 'text-xs text-rose-500';
            else el.className = 'text-xs text-gray-400';
        }

        async function syncToCloud() {
            if (!state.gasUrl) return;
            updateCloudStatus('syncing');
            try {
                await fetch(state.gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'save',
                        assignments: state.assignments
                    })
                });
                updateCloudStatus('success');
            } catch (err) {
                console.error('雲端同步失敗:', err);
                updateCloudStatus('error');
            }
        }

        async function syncFromCloud() {
            if (!state.gasUrl) {
                alert('請先輸入並儲存 GAS Web App 網址');
                return;
            }
            updateCloudStatus('syncing');
            try {
                const res = await fetch(`${state.gasUrl}?action=load`);
                const data = await res.json();
                if (data && data.assignments) {
                    state.assignments = data.assignments;
                    saveToStorage(false);
                    renderCalendar();
                    updateCloudStatus('success');
                    alert('已成功從雲端同步資料！');
                }
            } catch (err) {
                console.error('雲端載入失敗:', err);
                updateCloudStatus('error');
                alert('從雲端載入失敗，請檢查網址或權限。');
            }
        }

        // --- 複製單項進度 ---
        function copyAssignment(dateStr, assignId, event) {
            event.stopPropagation();
            if (!state.assignments[dateStr]) return;
            const target = state.assignments[dateStr].find(a => a.id === assignId);
            if (target) {
                const newAssign = {
                    id: 'assign-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
                    name: target.name + ' (副本)',
                    done: false
                };
                state.assignments[dateStr].push(newAssign);
                saveToStorage();
                renderCalendar();
            }
        }

        // --- 拖曳轉移邏輯 ---
        function moveAssignment(fromDate, toDate, assignId) {
            if (!fromDate || !toDate || !assignId || fromDate === toDate) return;
            if (!state.assignments[fromDate]) return;

            const index = state.assignments[fromDate].findIndex(a => a.id === assignId);
            if (index > -1) {
                const [item] = state.assignments[fromDate].splice(index, 1);
                if (state.assignments[fromDate].length === 0) delete state.assignments[fromDate];

                if (!state.assignments[toDate]) state.assignments[toDate] = [];
                state.assignments[toDate].push(item);

                saveToStorage();
                renderCalendar();
            }
        }

        // --- 拖曳事件處理 (Pointer Events) ---
        function attachDragListeners(cardEl, dateStr, assignId) {
            cardEl.ondragstart = (e) => {
                state.dragData.assignId = assignId;
                state.dragData.fromDateStr = dateStr;
                e.dataTransfer.setData('text/plain', JSON.stringify({ assignId, dateStr }));
                cardEl.classList.add('dragging');
            };

            cardEl.ondragend = () => {
                cardEl.classList.remove('dragging');
                clearDragHighlights();
            };

            cardEl.onpointerdown = (e) => {
                if (e.target.tagName === 'BUTTON' || e.target.tagName === 'I' || e.target.tagName === 'INPUT') return;

                state.dragData.assignId = assignId;
                state.dragData.fromDateStr = dateStr;

                const rect = cardEl.getBoundingClientRect();
                const clone = cardEl.cloneNode(true);
                clone.classList.add('drag-clone');
                clone.style.width = `${rect.width}px`;
                clone.style.left = `${e.clientX - rect.width / 2}px`;
                clone.style.top = `${e.clientY - rect.height / 2}px`;

                document.body.appendChild(clone);
                state.dragData.cloneEl = clone;
                cardEl.classList.add('dragging');

                window.onpointermove = (pe) => {
                    if (!state.dragData.cloneEl) return;
                    pe.preventDefault();

                    state.dragData.cloneEl.style.left = `${pe.clientX - rect.width / 2}px`;
                    state.dragData.cloneEl.style.top = `${pe.clientY - rect.height / 2}px`;

                    state.dragData.cloneEl.style.display = 'none';
                    const targetEl = document.elementFromPoint(pe.clientX, pe.clientY);
                    state.dragData.cloneEl.style.display = '';

                    const cellEl = targetEl?.closest('[data-date]');
                    clearDragHighlights();
                    if (cellEl) {
                        cellEl.classList.add('drag-over-target');
                        state.dragData.lastTargetCell = cellEl;
                    } else {
                        state.dragData.lastTargetCell = null;
                    }
                };

                window.onpointerup = (pe) => {
                    window.onpointermove = null;
                    window.onpointerup = null;

                    if (state.dragData.cloneEl) {
                        state.dragData.cloneEl.remove();
                        state.dragData.cloneEl = null;
                    }
                    cardEl.classList.remove('dragging');

                    if (state.dragData.lastTargetCell) {
                        const targetDate = state.dragData.lastTargetCell.getAttribute('data-date');
                        moveAssignment(state.dragData.fromDateStr, targetDate, state.dragData.assignId);
                    }
                    clearDragHighlights();
                };
            };
        }

        function clearDragHighlights() {
            document.querySelectorAll('.drag-over-target').forEach(el => el.classList.remove('drag-over-target'));
        }

        // --- 行內編輯與新增 ---
        function showInlineInput(dateStr, event) {
            if (event) event.stopPropagation();
            const container = document.getElementById(`input-container-${dateStr}`);
            if (!container || container.querySelector('input')) return;

            const isWeek = state.viewMode === 'week';
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = '新增進度... (例: 數學:複習第一章)';
            input.className = `w-full bg-[#F7F5F0] border border-[#8A9A86] rounded px-2 py-1 outline-none text-[#4A4A4A] ${
                isWeek ? 'text-lg py-2 px-3' : 'text-xs'
            }`;

            input.onkeydown = (e) => {
                if (e.key === 'Enter') saveInlineTask(dateStr, input.value);
                if (e.key === 'Escape') container.innerHTML = '';
            };
            input.onblur = () => {
                if (input.value.trim()) saveInlineTask(dateStr, input.value);
                else container.innerHTML = '';
            };

            container.appendChild(input);
            input.focus();
        }

        function saveInlineTask(dateStr, text) {
            const cleanText = text.trim();
            if (!cleanText) return;

            if (!state.assignments[dateStr]) state.assignments[dateStr] = [];
            state.assignments[dateStr].push({
                id: 'assign-' + Date.now(),
                name: cleanText,
                done: false
            });

            saveToStorage();
            renderCalendar();
        }

        function startInlineEdit(dateStr, assignId, event) {
            event.stopPropagation();
            const cardEl = document.getElementById(`card-${assignId}`);
            if (!cardEl) return;

            const assign = state.assignments[dateStr]?.find(a => a.id === assignId);
            if (!assign) return;

            const isWeek = state.viewMode === 'week';
            const input = document.createElement('input');
            input.type = 'text';
            input.value = assign.name;
            input.className = `w-full bg-white border border-[#8A9A86] rounded px-1.5 py-0.5 outline-none font-normal text-[#4A4A4A] ${
                isWeek ? 'text-xl' : 'text-xs'
            }`;

            cardEl.innerHTML = '';
            cardEl.appendChild(input);
            input.focus();
            input.select();

            const finishEdit = () => {
                const newText = input.value.trim();
                if (newText) {
                    assign.name = newText;
                    saveToStorage();
                }
                renderCalendar();
            };

            input.onkeydown = (e) => {
                if (e.key === 'Enter') finishEdit();
                if (e.key === 'Escape') renderCalendar();
            };
            input.onblur = finishEdit;
        }

        // --- 狀態更新 ---
        function updateCompletionBadge() {
            let total = 0, doneCount = 0;
            Object.values(state.assignments).forEach(list => {
                list.forEach(a => {
                    total++;
                    if (a.done) doneCount++;
                });
            });
            const rate = total === 0 ? 0 : Math.round((doneCount / total) * 100);
            const badge = document.getElementById('daily-completion-badge');
            if (badge) badge.innerText = `${rate}% 完成`;
        }

        function switchDeviceMode(mode) {
            state.deviceMode = mode;
            const container = document.getElementById('main-container');
            const btnMobile = document.getElementById('btn-device-mobile');
            const btnDesktop = document.getElementById('btn-device-desktop');

            if (mode === 'mobile') {
                container.classList.remove('max-w-full', 'px-6');
                container.classList.add('max-w-md');
                btnMobile.className = "px-2.5 py-1.5 rounded-md transition-all bg-white shadow-2xs text-[#4A4A4A]";
                btnDesktop.className = "px-2.5 py-1.5 rounded-md transition-all text-[#7A746B] hover:text-[#4A4A4A]";
            } else {
                container.classList.remove('max-w-md');
                container.classList.add('max-w-full', 'px-6');
                btnDesktop.className = "px-2.5 py-1.5 rounded-md transition-all bg-white shadow-2xs text-[#4A4A4A]";
                btnMobile.className = "px-2.5 py-1.5 rounded-md transition-all text-[#7A746B] hover:text-[#4A4A4A]";
            }
            saveToStorage(false);
            renderCalendar();
        }

        function switchView(mode) {
            state.viewMode = mode;
            const btnMonth = document.getElementById('btn-month-view');
            const btnWeek = document.getElementById('btn-week-view');
            const weekHeader = document.getElementById('week-header-row');
            
            if (mode === 'month') {
                btnMonth.className = "px-3 py-1.5 rounded-md transition-all bg-white shadow-2xs text-[#4A4A4A]";
                btnWeek.className = "px-3 py-1.5 rounded-md transition-all text-[#7A746B] hover:text-[#4A4A4A]";
                weekHeader.classList.remove('hidden');
            } else {
                btnWeek.className = "px-3 py-1.5 rounded-md transition-all bg-white shadow-2xs text-[#4A4A4A]";
                btnMonth.className = "px-3 py-1.5 rounded-md transition-all text-[#7A746B] hover:text-[#4A4A4A]";
                weekHeader.classList.add('hidden');
            }
            renderCalendar();
        }

        function navigateCalendar(direction) {
            if (state.viewMode === 'month') {
                state.currentDate.setMonth(state.currentDate.getMonth() + direction);
            } else {
                state.currentDate.setDate(state.currentDate.getDate() + (direction * 7));
            }
            renderCalendar();
        }

        function toggleTaskDone(dateStr, assignId, event) {
            event.stopPropagation();
            if (state.assignments[dateStr]) {
                const assign = state.assignments[dateStr].find(a => a.id === assignId);
                if (assign) {
                    assign.done = !assign.done;
                    saveToStorage();
                    renderCalendar();
                }
            }
        }

        function removeAssignment(dateStr, assignId, event) {
            event.stopPropagation();
            if (state.assignments[dateStr]) {
                state.assignments[dateStr] = state.assignments[dateStr].filter(a => a.id !== assignId);
                if (state.assignments[dateStr].length === 0) delete state.assignments[dateStr];
                saveToStorage();
                renderCalendar();
            }
        }

        function formatDateStr(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function toggleSidebar(open) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (open) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.add('opacity-100'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.remove('opacity-100');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function downloadBackup() {
            const dataStr = localStorage.getItem('muji_planner_ux_data') || JSON.stringify({assignments:{}, deviceMode:'mobile'});
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `日課便帖_備份_${formatDateStr(new Date())}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function triggerUploadBackup() { document.getElementById('backup-file-input').click(); }

        function handleUploadBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.assignments) {
                        state.assignments = parsed.assignments;
                        state.deviceMode = parsed.deviceMode || 'mobile';
                        saveToStorage();
                        switchDeviceMode(state.deviceMode);
                        renderCalendar();
                        toggleSidebar(false);
                    }
                } catch (err) { alert('備份檔案讀取失敗'); }
            };
            reader.readAsText(file);
        }

        // --- 核心日曆渲染 ---
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const title = document.getElementById('calendar-title');
            grid.innerHTML = '';

            const todayStr = formatDateStr(new Date());
            let daysArray = [];

            const year = state.currentDate.getFullYear();
            const month = state.currentDate.getMonth();
            title.innerText = `${year}年 ${String(month + 1).padStart(2, '0')}月`;

            if (state.viewMode === 'month') {
                let firstDayIndex = new Date(year, month, 1).getDay();
                firstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
                const totalDays = new Date(year, month + 1, 0).getDate();
                const prevTotalDays = new Date(year, month, 0).getDate();

                for (let i = firstDayIndex - 1; i >= 0; i--) {
                    daysArray.push({ date: new Date(year, month - 1, prevTotalDays - i), isCurrentMonth: false });
                }
                for (let i = 1; i <= totalDays; i++) {
                    daysArray.push({ date: new Date(year, month, i), isCurrentMonth: true });
                }
                let nextDays = 1;
                while (daysArray.length < 42) {
                    daysArray.push({ date: new Date(year, month + 1, nextDays++), isCurrentMonth: false });
                }
            } else {
                const currentDay = state.currentDate.getDay();
                const distanceToMonday = currentDay === 0 ? -6 : 1 - currentDay;
                const monday = new Date(state.currentDate);
                monday.setDate(monday.getDate() + distanceToMonday);

                for (let i = 0; i < 7; i++) {
                    const d = new Date(monday);
                    d.setDate(monday.getDate() + i);
                    daysArray.push({ date: d, isCurrentMonth: true });
                }
            }

            daysArray.forEach(cell => {
                const dateStr = formatDateStr(cell.date);
                const dayAssignments = state.assignments[dateStr] || [];
                const isToday = dateStr === todayStr;
                const cellEl = document.createElement('div');

                cellEl.setAttribute('data-date', dateStr);

                cellEl.ondragover = (e) => {
                    e.preventDefault();
                    cellEl.classList.add('drag-over-target');
                };
                cellEl.ondragleave = () => cellEl.classList.remove('drag-over-target');
                cellEl.ondrop = (e) => {
                    e.preventDefault();
                    cellEl.classList.remove('drag-over-target');
                    moveAssignment(state.dragData.fromDateStr, dateStr, state.dragData.assignId);
                };

                if (state.viewMode === 'month') {
                    // 月檢視：放大內邊距與文字級號
                    cellEl.className = `bg-white border rounded-xl p-2 flex flex-col justify-between transition-all duration-150 border-[#E6E2DC] min-h-[120px] group ${
                        !cell.isCurrentMonth ? 'opacity-30 bg-[#FAF9F6]' : ''
                    } ${isToday ? 'ring-2 ring-[#8A9A86] bg-[#F1F3F0]' : ''}`;

                    const isWeekend = cell.date.getDay() === 0 || cell.date.getDay() === 6;
                    let dayNumClass = "text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center pointer-events-none ";
                    dayNumClass += isToday ? "bg-[#8A9A86] text-white" : (isWeekend ? "text-[#B87C67]" : "text-[#5C5750]");

                    const taskListContainer = document.createElement('div');
                    taskListContainer.className = "space-y-1.5 my-1.5 overflow-y-auto no-scrollbar flex-1 flex flex-col justify-start";

                    dayAssignments.forEach(assign => {
                        const colorClass = getSubjectColorClass(assign.name, assign.done);
                        const card = document.createElement('div');
                        card.id = `card-${assign.id}`;
                        card.draggable = true;
                        
                        // 調大月曆卡片的字級 (text-xs) 與內邊距 (px-2 py-1.5)
                        card.className = `task-card group/item relative flex items-center justify-between text-xs leading-snug px-2 py-1.5 rounded-md border select-none shadow-2xs ${colorClass}`;

                        card.onclick = (e) => toggleTaskDone(dateStr, assign.id, e);
                        card.ondblclick = (e) => startInlineEdit(dateStr, assign.id, e);

                        card.innerHTML = `
                            <span class="truncate pr-10 pointer-events-none font-medium">${assign.name}</span>
                            <div class="no-print absolute right-1 top-1/2 -translate-y-1/2 opacity-0 group-hover/item:opacity-100 transition-opacity flex items-center gap-1 bg-white/80 backdrop-blur-xs px-1 rounded">
                                <button onclick="copyAssignment('${dateStr}', '${assign.id}', event)" title="複製進度" class="text-[#7A746B] hover:text-[#8A9A86] text-[10px]">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                                <button onclick="removeAssignment('${dateStr}', '${assign.id}', event)" title="刪除進度" class="text-[#C9A297] hover:text-[#B87C67] text-[10px]">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        `;

                        attachDragListeners(card, dateStr, assign.id);
                        taskListContainer.appendChild(card);
                    });

                    const headerEl = document.createElement('div');
                    headerEl.className = "flex justify-between items-center border-b border-[#F7F5F0] pb-1 pointer-events-none";
                    headerEl.innerHTML = `
                        <span class="${dayNumClass}">${cell.date.getDate()}</span>
                        <button onclick="showInlineInput('${dateStr}', event)" class="pointer-events-auto no-print text-[#A69F92] hover:text-[#8A9A86] text-sm w-5 h-5 rounded hover:bg-[#EAE6DF] flex items-center justify-center">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    `;

                    const inputContainer = document.createElement('div');
                    inputContainer.id = `input-container-${dateStr}`;

                    cellEl.appendChild(headerEl);
                    cellEl.appendChild(taskListContainer);
                    cellEl.appendChild(inputContainer);

                } else {
                    // 週檢視模式
                    cellEl.className = `bg-white border rounded-xl p-3 flex flex-row items-start gap-3 transition-all border-[#E6E2DC] ${
                        isToday ? 'ring-2 ring-[#8A9A86] bg-[#F1F3F0]' : ''
                    }`;

                    const weekNames = ["日", "一", "二", "三", "四", "五", "六"];
                    const isWeekend = cell.date.getDay() === 0 || cell.date.getDay() === 6;

                    const taskListContainer = document.createElement('div');
                    taskListContainer.className = "flex flex-row flex-wrap gap-2.5 items-center flex-1";

                    dayAssignments.forEach(assign => {
                        const colorClass = getSubjectColorClass(assign.name, assign.done);
                        const card = document.createElement('div');
                        card.id = `card-${assign.id}`;
                        card.draggable = true;
                        card.className = `task-card group/item relative flex items-center justify-between text-base font-medium px-4 py-2.5 rounded-lg border select-none shadow-2xs ${colorClass}`;

                        card.onclick = (e) => toggleTaskDone(dateStr, assign.id, e);
                        card.ondblclick = (e) => startInlineEdit(dateStr, assign.id, e);

                        card.innerHTML = `
                            <span class="pr-12 pointer-events-none">${assign.name}</span>
                            <div class="no-print absolute right-2 top-1/2 -translate-y-1/2 opacity-0 group-hover/item:opacity-100 transition-opacity flex items-center gap-2 bg-white/80 backdrop-blur-xs px-1.5 py-0.5 rounded-md">
                                <button onclick="copyAssignment('${dateStr}', '${assign.id}', event)" title="複製進度" class="text-[#7A746B] hover:text-[#8A9A86] text-xs">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                                <button onclick="removeAssignment('${dateStr}', '${assign.id}', event)" title="刪除進度" class="text-[#C9A297] hover:text-[#B87C67] text-xs">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        `;

                        attachDragListeners(card, dateStr, assign.id);
                        taskListContainer.appendChild(card);
                    });

                    const sideHeader = document.createElement('div');
                    sideHeader.className = "flex flex-col items-center justify-center bg-[#F2EFEA] rounded-lg p-2.5 min-w-[60px] pointer-events-none";
                    sideHeader.innerHTML = `
                        <span class="text-xs font-bold text-[#7A746B]">週${weekNames[cell.date.getDay()]}</span>
                        <span class="text-xl font-bold ${isWeekend ? 'text-[#B87C67]' : 'text-[#4A4A4A]'}">${cell.date.getDate()}</span>
                    `;

                    const addBtn = document.createElement('button');
                    addBtn.className = "no-print border border-dashed border-[#8A9A86] text-[#8A9A86] hover:bg-[#8A9A86] hover:text-white transition-all text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-1.5";
                    addBtn.innerHTML = `<i class="fa-solid fa-plus pointer-events-none"></i> 新增進度`;
                    addBtn.onclick = (e) => showInlineInput(dateStr, e);

                    const inputContainer = document.createElement('div');
                    inputContainer.id = `input-container-${dateStr}`;
                    inputContainer.className = "min-w-[160px]";

                    taskListContainer.appendChild(inputContainer);
                    taskListContainer.appendChild(addBtn);

                    cellEl.appendChild(sideHeader);
                    cellEl.appendChild(taskListContainer);
                }

                grid.appendChild(cellEl);
            });

            grid.className = state.viewMode === 'week' ? "grid grid-cols-1 gap-2.5 flex-1" : "grid grid-cols-7 gap-1.5 flex-1 min-h-[500px]";
        }

        window.onload = function() {
            initStorage();
            renderCalendar();
        };
    </script>
</body>
</html>

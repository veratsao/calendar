<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日課便帖 | 清新簡約版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
            background-color: #f8f6f0;
            color: #332e2b;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .fresh-container {
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            border-radius: 20px;
            border: 1px solid #ebe5d8;
        }

        .fresh-btn {
            background-color: #f3efe6;
            color: #524b43;
            border: 1px solid #e2dacd;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .fresh-btn:hover {
            background-color: #e8e1d3;
            color: #211d19;
            transform: translateY(-1px);
        }
        .fresh-btn:active {
            transform: translateY(0);
        }

        .fresh-cell {
            background-color: #faf8f5;
            border: 1px solid #eee8dd;
            border-radius: 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .fresh-cell:hover {
            border-color: #d6ccb8;
        }
        .fresh-cell.today {
            background-color: #ffffff;
            border: 2px solid #5b7c99;
            box-shadow: 0 4px 12px rgba(91, 124, 153, 0.12);
        }

        .task-card {
            touch-action: none;
            cursor: grab;
            border-radius: 8px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .task-card:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        .task-card:active {
            cursor: grabbing;
        }
        .task-card.dragging {
            opacity: 0.3 !important;
        }
        
        .drag-clone {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.95;
            transform: scale(1.03) rotate(1deg);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .drag-over-target {
            background-color: #f0eadd !important;
            border: 2px dashed #9e9280 !important;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen p-2 md:p-6 flex flex-col items-center justify-center">

    <div class="fresh-container w-full max-w-7xl flex flex-col min-h-[90vh] p-4 md:p-6 relative">
        
        <header class="bg-[#f2ece1] rounded-2xl p-3.5 mb-4 flex flex-wrap justify-between items-center border border-[#e5dccf]">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar(true)" class="fresh-btn px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5">
                    <i class="fa-solid fa-sliders text-stone-500"></i> 設定
                </button>
                <h1 class="text-lg md:text-xl font-bold tracking-tight text-[#3d3630] flex items-center gap-2">
                    <i class="fa-regular fa-calendar-check text-[#718d80]"></i> 日課便帖
                    <span id="daily-completion-badge" class="text-xs bg-[#e0d6c3] text-[#423a33] font-extrabold px-2.5 py-0.5 rounded-full">0% 完成</span>
                    <span id="cloud-status-indicator" class="text-xs text-stone-400" title="雲端同步狀態">
                        <i class="fa-solid fa-cloud"></i>
                    </span>
                </h1>
            </div>
            
            <div class="flex items-center gap-2 mt-2 sm:mt-0">
                <div class="bg-[#e5dccf] p-1 rounded-xl flex gap-1">
                    <button id="btn-device-mobile" onclick="switchDeviceMode('mobile')" class="px-2.5 py-1 rounded-lg text-stone-600 hover:bg-[#f2ece1] text-xs">
                        <i class="fa-solid fa-mobile-screen-button"></i>
                    </button>
                    <button id="btn-device-desktop" onclick="switchDeviceMode('desktop')" class="px-2.5 py-1 rounded-lg text-stone-600 hover:bg-[#f2ece1] text-xs">
                        <i class="fa-solid fa-desktop"></i>
                    </button>
                </div>

                <div class="bg-[#e5dccf] p-1 rounded-xl flex gap-1">
                    <button id="btn-month-view" onclick="switchView('month')" class="px-3 py-1 rounded-lg font-bold text-xs bg-white text-stone-800 shadow-sm">月</button>
                    <button id="btn-week-view" onclick="switchView('week')" class="px-3 py-1 rounded-lg font-bold text-xs text-stone-600 hover:bg-[#f2ece1]">週</button>
                </div>
                
                <button onclick="window.print()" class="fresh-btn p-2 rounded-xl text-xs">
                    <i class="fa-solid fa-print"></i>
                </button>
            </div>
        </header>

        <main id="main-container" class="flex-1 mx-auto w-full flex flex-col gap-3 transition-all duration-300">
            
            <div class="flex justify-between items-center bg-[#faf8f5] px-5 py-2.5 rounded-2xl border border-[#eee8dd]">
                <button onclick="navigateCalendar(-1)" class="fresh-btn w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div class="text-center">
                    <h2 id="calendar-title" class="font-bold text-[#3d3630] tracking-wide text-base md:text-lg">2026年 09月</h2>
                </div>
                <button onclick="navigateCalendar(1)" class="fresh-btn w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <div id="week-header-row" class="grid grid-cols-7 gap-2 text-center text-xs font-bold text-[#786e65] px-1">
                <div class="py-1">一</div>
                <div class="py-1">二</div>
                <div class="py-1">三</div>
                <div class="py-1">四</div>
                <div class="py-1">五</div>
                <div class="py-1 text-rose-500">六</div>
                <div class="py-1 text-rose-500">日</div>
            </div>

            <div id="calendar-grid" class="grid grid-cols-7 gap-2 flex-1 min-h-[520px]">
                <!-- 動態渲染 -->
            </div>

        </main>
    </div>

    <!-- 側邊 Drawer -->
    <div id="sidebar-overlay" onclick="toggleSidebar(false)" class="hidden fixed inset-0 bg-black/20 backdrop-blur-xs z-40 transition-opacity duration-300 opacity-0"></div>
    <aside id="sidebar" class="fixed top-0 bottom-0 left-0 w-[85%] max-w-sm bg-[#faf8f5] border-r border-[#e8e2d5] z-50 transform -translate-x-full transition-transform duration-300 ease-out flex flex-col shadow-xl">
        <div class="p-4 bg-[#f2ece1] text-stone-700 flex justify-between items-center border-b border-[#e5dccf]">
            <h3 class="font-bold flex items-center gap-2 text-sm">
                <i class="fa-solid fa-sliders text-stone-500"></i> 設定與雲端備份
            </h3>
            <button onclick="toggleSidebar(false)" class="text-stone-400 hover:text-stone-700 w-8 h-8 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="p-4 space-y-4 flex-1 overflow-y-auto">
            <div class="bg-white p-4 rounded-2xl border border-[#eee8dd] shadow-xs space-y-3">
                <div class="text-xs font-bold text-stone-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-cloud-arrow-up text-sky-600"></i> Google Apps Script 網址
                </div>
                <input type="url" id="gas-url-input" placeholder="貼上 GAS Web App URL..." 
                       class="w-full text-xs p-2.5 border border-[#e2dacd] rounded-xl bg-[#faf8f5] focus:outline-none focus:ring-2 focus:ring-stone-400">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="saveGasUrl()" class="fresh-btn py-2 px-2 rounded-xl text-xs font-bold">
                        儲存網址
                    </button>
                    <button onclick="syncFromCloud()" class="fresh-btn py-2 px-2 rounded-xl text-xs font-bold">
                        從雲端載入
                    </button>
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl border border-[#eee8dd] shadow-xs space-y-3">
                <div class="text-xs font-bold text-stone-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-database text-amber-600"></i> 本地檔案備份
                </div>
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button onclick="downloadBackup()" class="fresh-btn py-2 px-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1">
                        <i class="fa-solid fa-download"></i> 下載備份
                    </button>
                    <button onclick="triggerUploadBackup()" class="fresh-btn py-2 px-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1">
                        <i class="fa-solid fa-upload"></i> 上傳還原
                    </button>
                </div>
                <input type="file" id="backup-file-input" accept=".json" class="hidden" onchange="handleUploadBackup(event)">
            </div>
        </div>
    </aside>

    <script>
        // --- 清新配色（五科 + 五科以外擴充配色） ---
        const SUBJECT_COLORS = {
            '國文': 'bg-rose-100 text-rose-800 border-rose-200',
            '英文': 'bg-sky-100 text-sky-800 border-sky-200',
            '數學': 'bg-emerald-100 text-emerald-800 border-emerald-200',
            '自然': 'bg-teal-100 text-teal-800 border-teal-200',
            '社會': 'bg-amber-100 text-amber-800 border-amber-200',
            
            '物理': 'bg-purple-100 text-purple-800 border-purple-200',
            '化學': 'bg-fuchsia-100 text-fuchsia-800 border-fuchsia-200',
            '歷史': 'bg-stone-200 text-stone-800 border-stone-300',
            '地理': 'bg-lime-100 text-lime-800 border-lime-200',
            '公民': 'bg-cyan-100 text-cyan-800 border-cyan-200',
            
            'default': 'bg-slate-100 text-slate-700 border-slate-200'
        };

        let state = {
            currentDate: new Date(),
            viewMode: 'month',
            deviceMode: 'mobile',
            assignments: {},
            gasUrl: '',
            
            dragData: {
                assignId: null,
                fromDateStr: null,
                cloneEl: null,
                lastTargetCell: null
            }
        };

        function initStorage() {
            const localData = localStorage.getItem('muji_planner_ux_data');
            state.gasUrl = localStorage.getItem('muji_planner_gas_url') || '';
            if (state.gasUrl) {
                document.getElementById('gas-url-input').value = state.gasUrl;
            }

            if (localData) {
                try {
                    const parsed = JSON.parse(localData);
                    state.assignments = parsed.assignments || {};
                    state.deviceMode = parsed.deviceMode || 'mobile';
                } catch (e) { loadMockData(); }
            } else {
                loadMockData();
            }
            state.currentDate = new Date();
            saveToStorage(false);
            switchDeviceMode(state.deviceMode);
        }

        function saveToStorage(triggerCloud = true) {
            localStorage.setItem('muji_planner_ux_data', JSON.stringify({
                assignments: state.assignments,
                deviceMode: state.deviceMode
            }));
            updateCompletionBadge();

            if (triggerCloud && state.gasUrl) {
                syncToCloud();
            }
        }

        function loadMockData() {
            const todayStr = formatDateStr(new Date());
            state.assignments = {};
            state.assignments[todayStr] = [
                { id: 'assign-1', name: '數學: 微分練習', done: false },
                { id: 'assign-2', name: '英文: Unit 5 單字', done: true }
            ];
            state.deviceMode = 'mobile';
        }

        function getSubjectColorClass(name, done) {
            if (done) return 'bg-stone-100 border-stone-200 text-stone-400 line-through opacity-75';
            
            for (let sub in SUBJECT_COLORS) {
                if (sub !== 'default' && (name.includes(sub) || name.startsWith(`[${sub}]`) || name.startsWith(`${sub}:`))) {
                    return SUBJECT_COLORS[sub];
                }
            }
            return SUBJECT_COLORS['default'];
        }

        function saveGasUrl() {
            const url = document.getElementById('gas-url-input').value.trim();
            state.gasUrl = url;
            localStorage.setItem('muji_planner_gas_url', url);
            alert('Google Apps Script 網址已儲存！');
            if (url) syncToCloud();
        }

        function updateCloudStatus(status) {
            const el = document.getElementById('cloud-status-indicator');
            if (!el) return;
            if (status === 'syncing') el.className = 'text-xs text-amber-500 animate-pulse';
            else if (status === 'success') el.className = 'text-xs text-emerald-500';
            else if (status === 'error') el.className = 'text-xs text-rose-500';
            else el.className = 'text-xs text-stone-400';
        }

        async function syncToCloud() {
            if (!state.gasUrl) return;
            updateCloudStatus('syncing');
            try {
                await fetch(state.gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'save', assignments: state.assignments })
                });
                updateCloudStatus('success');
            } catch (err) {
                updateCloudStatus('error');
            }
        }

        async function syncFromCloud() {
            if (!state.gasUrl) { alert('請先輸入並儲存 GAS 網址'); return; }
            updateCloudStatus('syncing');
            try {
                const res = await fetch(`${state.gasUrl}?action=load`);
                const data = await res.json();
                if (data && data.assignments) {
                    state.assignments = data.assignments;
                    saveToStorage(false);
                    renderCalendar();
                    updateCloudStatus('success');
                    alert('成功載入雲端資料！');
                }
            } catch (err) {
                updateCloudStatus('error');
                alert('載入失敗，請檢查網址或權限。');
            }
        }

        function copyAssignment(dateStr, assignId, event) {
            event.stopPropagation();
            if (!state.assignments[dateStr]) return;
            const target = state.assignments[dateStr].find(a => a.id === assignId);
            if (target) {
                const newAssign = {
                    id: 'assign-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
                    name: target.name + ' (副本)',
                    done: false
                };
                state.assignments[dateStr].push(newAssign);
                saveToStorage();
                renderCalendar();
            }
        }

        function moveAssignment(fromDate, toDate, assignId) {
            if (!fromDate || !toDate || !assignId || fromDate === toDate) return;
            if (!state.assignments[fromDate]) return;

            const index = state.assignments[fromDate].findIndex(a => a.id === assignId);
            if (index > -1) {
                const [item] = state.assignments[fromDate].splice(index, 1);
                if (state.assignments[fromDate].length === 0) delete state.assignments[fromDate];

                if (!state.assignments[toDate]) state.assignments[toDate] = [];
                state.assignments[toDate].push(item);

                saveToStorage();
                renderCalendar();
            }
        }

        function attachDragListeners(cardEl, dateStr, assignId) {
            cardEl.ondragstart = (e) => {
                state.dragData.assignId = assignId;
                state.dragData.fromDateStr = dateStr;
                e.dataTransfer.setData('text/plain', JSON.stringify({ assignId, dateStr }));
                cardEl.classList.add('dragging');
            };

            cardEl.ondragend = () => {
                cardEl.classList.remove('dragging');
                clearDragHighlights();
            };

            cardEl.onpointerdown = (e) => {
                if (e.target.tagName === 'BUTTON' || e.target.tagName === 'I' || e.target.tagName === 'INPUT') return;

                state.dragData.assignId = assignId;
                state.dragData.fromDateStr = dateStr;

                const rect = cardEl.getBoundingClientRect();
                const clone = cardEl.cloneNode(true);
                clone.classList.add('drag-clone');
                clone.style.width = `${rect.width}px`;
                clone.style.left = `${e.clientX - rect.width / 2}px`;
                clone.style.top = `${e.clientY - rect.height / 2}px`;

                document.body.appendChild(clone);
                state.dragData.cloneEl = clone;
                cardEl.classList.add('dragging');

                window.onpointermove = (pe) => {
                    if (!state.dragData.cloneEl) return;
                    pe.preventDefault();

                    state.dragData.cloneEl.style.left = `${pe.clientX - rect.width / 2}px`;
                    state.dragData.cloneEl.style.top = `${pe.clientY - rect.height / 2}px`;

                    state.dragData.cloneEl.style.display = 'none';
                    const targetEl = document.elementFromPoint(pe.clientX, pe.clientY);
                    state.dragData.cloneEl.style.display = '';

                    const cellEl = targetEl?.closest('[data-date]');
                    clearDragHighlights();
                    if (cellEl) {
                        cellEl.classList.add('drag-over-target');
                        state.dragData.lastTargetCell = cellEl;
                    } else {
                        state.dragData.lastTargetCell = null;
                    }
                };

                window.onpointerup = () => {
                    window.onpointermove = null;
                    window.onpointerup = null;

                    if (state.dragData.cloneEl) {
                        state.dragData.cloneEl.remove();
                        state.dragData.cloneEl = null;
                    }
                    cardEl.classList.remove('dragging');

                    if (state.dragData.lastTargetCell) {
                        const targetDate = state.dragData.lastTargetCell.getAttribute('data-date');
                        moveAssignment(state.dragData.fromDateStr, targetDate, state.dragData.assignId);
                    }
                    clearDragHighlights();
                };
            };
        }

        function clearDragHighlights() {
            document.querySelectorAll('.drag-over-target').forEach(el => el.classList.remove('drag-over-target'));
        }

        function showInlineInput(dateStr, event) {
            if (event) event.stopPropagation();
            const container = document.getElementById(`input-container-${dateStr}`);
            if (!container || container.querySelector('input')) return;

            const isWeek = state.viewMode === 'week';
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = '輸入進度...';
            input.className = `w-full bg-white border border-stone-300 rounded-md px-2 py-1 outline-none text-stone-800 font-medium shadow-xs ${
                isWeek ? 'text-sm py-1.5 px-3' : 'text-xs'
            }`;

            let isSaved = false;
            const doSave = () => {
                if (isSaved) return;
                isSaved = true;
                saveInlineTask(dateStr, input.value);
            };

            input.onkeydown = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); doSave(); }
                if (e.key === 'Escape') { isSaved = true; container.innerHTML = ''; }
            };
            input.onblur = () => { doSave(); };

            container.appendChild(input);
            input.focus();
        }

        function saveInlineTask(dateStr, text) {
            const cleanText = text.trim();
            if (!cleanText) return;

            if (!state.assignments[dateStr]) state.assignments[dateStr] = [];
            state.assignments[dateStr].push({
                id: 'assign-' + Date.now(),
                name: cleanText,
                done: false
            });

            saveToStorage();
            renderCalendar();
        }

        function startInlineEdit(dateStr, assignId, event) {
            event.stopPropagation();
            const cardEl = document.getElementById(`card-${assignId}`);
            if (!cardEl) return;

            const assign = state.assignments[dateStr]?.find(a => a.id === assignId);
            if (!assign) return;

            const isWeek = state.viewMode === 'week';
            const input = document.createElement('input');
            input.type = 'text';
            input.value = assign.name;
            input.className = `w-full bg-white border border-stone-300 rounded px-1 py-0.5 outline-none font-medium text-stone-800 ${
                isWeek ? 'text-sm' : 'text-xs'
            }`;

            cardEl.innerHTML = '';
            cardEl.appendChild(input);
            input.focus();
            input.select();

            let isFinished = false;
            const finishEdit = () => {
                if (isFinished) return;
                isFinished = true;
                const newText = input.value.trim();
                if (newText) {
                    assign.name = newText;
                    saveToStorage();
                }
                renderCalendar();
            };

            input.onkeydown = (e) => {
                if (e.key === 'Enter') finishEdit();
                if (e.key === 'Escape') { isFinished = true; renderCalendar(); }
            };
            input.onblur = finishEdit;
        }

        function updateCompletionBadge() {
            let total = 0, doneCount = 0;
            Object.values(state.assignments).forEach(list => {
                list.forEach(a => {
                    total++;
                    if (a.done) doneCount++;
                });
            });
            const rate = total === 0 ? 0 : Math.round((doneCount / total) * 100);
            const badge = document.getElementById('daily-completion-badge');
            if (badge) badge.innerText = `${rate}% 完成`;
        }

        function switchDeviceMode(mode) {
            state.deviceMode = mode;
            const container = document.getElementById('main-container');
            const btnMobile = document.getElementById('btn-device-mobile');
            const btnDesktop = document.getElementById('btn-device-desktop');

            if (mode === 'mobile') {
                container.classList.remove('max-w-full');
                container.classList.add('max-w-md');
                btnMobile.className = "px-2.5 py-1 rounded-lg bg-white text-stone-800 font-bold shadow-xs";
                btnDesktop.className = "px-2.5 py-1 rounded-lg text-stone-600 hover:bg-[#f2ece1]";
            } else {
                container.classList.remove('max-w-md');
                container.classList.add('max-w-full');
                btnDesktop.className = "px-2.5 py-1 rounded-lg bg-white text-stone-800 font-bold shadow-xs";
                btnMobile.className = "px-2.5 py-1 rounded-lg text-stone-600 hover:bg-[#f2ece1]";
            }
            saveToStorage(false);
            renderCalendar();
        }

        function switchView(mode) {
            state.viewMode = mode;
            const btnMonth = document.getElementById('btn-month-view');
            const btnWeek = document.getElementById('btn-week-view');
            const weekHeader = document.getElementById('week-header-row');
            
            if (mode === 'month') {
                btnMonth.className = "px-3 py-1 rounded-lg font-bold text-xs bg-white text-stone-800 shadow-sm";
                btnWeek.className = "px-3 py-1 rounded-lg font-bold text-xs text-stone-600 hover:bg-[#f2ece1]";
                weekHeader.classList.remove('hidden');
            } else {
                btnWeek.className = "px-3 py-1 rounded-lg font-bold text-xs bg-white text-stone-800 shadow-sm";
                btnMonth.className = "px-3 py-1 rounded-lg font-bold text-xs text-stone-600 hover:bg-[#f2ece1]";
                weekHeader.classList.add('hidden');
            }
            renderCalendar();
        }

        function navigateCalendar(direction) {
            if (state.viewMode === 'month') {
                state.currentDate.setMonth(state.currentDate.getMonth() + direction);
            } else {
                state.currentDate.setDate(state.currentDate.getDate() + (direction * 7));
            }
            renderCalendar();
        }

        function toggleTaskDone(dateStr, assignId, event) {
            event.stopPropagation();
            if (state.assignments[dateStr]) {
                const assign = state.assignments[dateStr].find(a => a.id === assignId);
                if (assign) {
                    assign.done = !assign.done;
                    saveToStorage();
                    renderCalendar();
                }
            }
        }

        function removeAssignment(dateStr, assignId, event) {
            event.stopPropagation();
            if (state.assignments[dateStr]) {
                state.assignments[dateStr] = state.assignments[dateStr].filter(a => a.id !== assignId);
                if (state.assignments[dateStr].length === 0) delete state.assignments[dateStr];
                saveToStorage();
                renderCalendar();
            }
        }

        function formatDateStr(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function toggleSidebar(open) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (open) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.add('opacity-100'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.remove('opacity-100');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function downloadBackup() {
            const dataStr = localStorage.getItem('muji_planner_ux_data') || JSON.stringify({assignments:{}, deviceMode:'mobile'});
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `日課便帖_備份_${formatDateStr(new Date())}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function triggerUploadBackup() { document.getElementById('backup-file-input').click(); }

        function handleUploadBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.assignments) {
                        state.assignments = parsed.assignments;
                        state.deviceMode = parsed.deviceMode || 'mobile';
                        saveToStorage();
                        switchDeviceMode(state.deviceMode);
                        renderCalendar();
                        toggleSidebar(false);
                    }
                } catch (err) { alert('備份檔案讀取失敗'); }
            };
            reader.readAsText(file);
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const title = document.getElementById('calendar-title');
            grid.innerHTML = '';

            const todayStr = formatDateStr(new Date());
            let daysArray = [];

            const year = state.currentDate.getFullYear();
            const month = state.currentDate.getMonth();
            title.innerText = `${year}年 ${String(month + 1).padStart(2, '0')}月`;

            if (state.viewMode === 'month') {
                let firstDayIndex = new Date(year, month, 1).getDay();
                firstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
                const totalDays = new Date(year, month + 1, 0).getDate();
                const prevTotalDays = new Date(year, month, 0).getDate();

                for (let i = firstDayIndex - 1; i >= 0; i--) {
                    daysArray.push({ date: new Date(year, month - 1, prevTotalDays - i), isCurrentMonth: false });
                }
                for (let i = 1; i <= totalDays; i++) {
                    daysArray.push({ date: new Date(year, month, i), isCurrentMonth: true });
                }
                let nextDays = 1;
                while (daysArray.length < 42) {
                    daysArray.push({ date: new Date(year, month + 1, nextDays++), isCurrentMonth: false });
                }
            } else {
                const currentDay = state.currentDate.getDay();
                const distanceToMonday = currentDay === 0 ? -6 : 1 - currentDay;
                const monday = new Date(state.currentDate);
                monday.setDate(monday.getDate() + distanceToMonday);

                for (let i = 0; i < 7; i++) {
                    const d = new Date(monday);
                    d.setDate(monday.getDate() + i);
                    daysArray.push({ date: d, isCurrentMonth: true });
                }
            }

            daysArray.forEach(cell => {
                const dateStr = formatDateStr(cell.date);
                const dayAssignments = state.assignments[dateStr] || [];
                const isToday = dateStr === todayStr;
                const cellEl = document.createElement('div');

                cellEl.setAttribute('data-date', dateStr);

                cellEl.ondragover = (e) => { e.preventDefault(); cellEl.classList.add('drag-over-target'); };
                cellEl.ondragleave = () => cellEl.classList.remove('drag-over-target');
                cellEl.ondrop = (e) => {
                    e.preventDefault();
                    cellEl.classList.remove('drag-over-target');
                    moveAssignment(state.dragData.fromDateStr, dateStr, state.dragData.assignId);
                };

                if (state.viewMode === 'month') {
                    cellEl.className = `fresh-cell p-2 flex flex-col justify-between transition-all min-h-[120px] group ${
                        !cell.isCurrentMonth ? 'opacity-30 bg-[#f3efe6]' : ''
                    } ${isToday ? 'today' : ''}`;

                    const isWeekend = cell.date.getDay() === 0 || cell.date.getDay() === 6;
                    let dayNumClass = "text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center pointer-events-none ";
                    dayNumClass += isToday ? "bg-[#5b7c99] text-white shadow-xs" : (isWeekend ? "text-rose-500" : "text-stone-700");

                    const taskListContainer = document.createElement('div');
                    taskListContainer.className = "space-y-1.5 my-1.5 overflow-y-auto no-scrollbar flex-1 flex flex-col justify-start";

                    dayAssignments.forEach(assign => {
                        const colorClass = getSubjectColorClass(assign.name, assign.done);
                        const card = document.createElement('div');
                        card.id = `card-${assign.id}`;
                        card.draggable = true;
                        
                        card.className = `task-card group/item relative flex items-center justify-between text-xs leading-tight px-2 py-1.5 border ${colorClass}`;

                        card.onclick = (e) => toggleTaskDone(dateStr, assign.id, e);
                        card.ondblclick = (e) => startInlineEdit(dateStr, assign.id, e);

                        // 新增修改 (Pencil) 按鈕
                        card.innerHTML = `
                            <span class="truncate pr-12 pointer-events-none font-medium">${assign.name}</span>
                            <div class="no-print absolute right-1 top-1/2 -translate-y-1/2 opacity-0 group-hover/item:opacity-100 transition-opacity flex items-center gap-1 bg-white/90 backdrop-blur-xs px-1 rounded border border-stone-200 shadow-xs">
                                <button onclick="startInlineEdit('${dateStr}', '${assign.id}', event)" title="修改內容" class="text-stone-500 hover:text-stone-800 text-[10px]">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button onclick="copyAssignment('${dateStr}', '${assign.id}', event)" title="複製進度" class="text-stone-500 hover:text-stone-800 text-[10px]">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                                <button onclick="removeAssignment('${dateStr}', '${assign.id}', event)" title="刪除進度" class="text-stone-500 hover:text-rose-600 text-[10px]">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        `;

                        attachDragListeners(card, dateStr, assign.id);
                        taskListContainer.appendChild(card);
                    });

                    const headerEl = document.createElement('div');
                    headerEl.className = "flex justify-between items-center border-b border-[#eee8dd] pb-1 pointer-events-none";
                    headerEl.innerHTML = `
                        <span class="${dayNumClass}">${cell.date.getDate()}</span>
                        <button onclick="showInlineInput('${dateStr}', event)" class="pointer-events-auto no-print fresh-btn text-stone-600 text-xs w-5 h-5 rounded-md flex items-center justify-center font-bold">
                            <i class="fa-solid fa-plus text-[10px]"></i>
                        </button>
                    `;

                    const inputContainer = document.createElement('div');
                    inputContainer.id = `input-container-${dateStr}`;

                    cellEl.appendChild(headerEl);
                    cellEl.appendChild(taskListContainer);
                    cellEl.appendChild(inputContainer);

                } else {
                    // 週檢視模式
                    cellEl.className = `fresh-cell p-3 flex flex-row items-start gap-3 transition-all ${
                        isToday ? 'today' : ''
                    }`;

                    const weekNames = ["日", "一", "二", "三", "四", "五", "六"];
                    const isWeekend = cell.date.getDay() === 0 || cell.date.getDay() === 6;

                    const taskListContainer = document.createElement('div');
                    taskListContainer.className = "flex flex-row flex-wrap gap-2 items-center flex-1";

                    dayAssignments.forEach(assign => {
                        const colorClass = getSubjectColorClass(assign.name, assign.done);
                        const card = document.createElement('div');
                        card.id = `card-${assign.id}`;
                        card.draggable = true;
                        card.className = `task-card group/item relative flex items-center justify-between text-sm px-3 py-1.5 border ${colorClass}`;

                        card.onclick = (e) => toggleTaskDone(dateStr, assign.id, e);
                        card.ondblclick = (e) => startInlineEdit(dateStr, assign.id, e);

                        // 週視角修改按鈕
                        card.innerHTML = `
                            <span class="pr-16 pointer-events-none font-medium">${assign.name}</span>
                            <div class="no-print absolute right-1.5 top-1/2 -translate-y-1/2 opacity-0 group-hover/item:opacity-100 transition-opacity flex items-center gap-1.5 bg-white/90 backdrop-blur-xs px-1.5 py-0.5 rounded border border-stone-200 shadow-xs">
                                <button onclick="startInlineEdit('${dateStr}', '${assign.id}', event)" title="修改內容" class="text-stone-500 hover:text-stone-800 text-xs">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button onclick="copyAssignment('${dateStr}', '${assign.id}', event)" title="複製進度" class="text-stone-500 hover:text-stone-800 text-xs">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                                <button onclick="removeAssignment('${dateStr}', '${assign.id}', event)" title="刪除進度" class="text-stone-500 hover:text-rose-600 text-xs">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        `;

                        attachDragListeners(card, dateStr, assign.id);
                        taskListContainer.appendChild(card);
                    });

                    const sideHeader = document.createElement('div');
                    sideHeader.className = "flex flex-col items-center justify-center bg-[#f2ece1] border border-[#e5dccf] rounded-xl p-2 min-w-[60px] pointer-events-none";
                    sideHeader.innerHTML = `
                        <span class="text-xs font-bold text-stone-500">週${weekNames[cell.date.getDay()]}</span>
                        <span class="text-lg font-bold ${isWeekend ? 'text-rose-500' : 'text-stone-800'}">${cell.date.getDate()}</span>
                    `;

                    const addBtn = document.createElement('button');
                    addBtn.className = "fresh-btn text-stone-700 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1";
                    addBtn.innerHTML = `<i class="fa-solid fa-plus pointer-events-none text-[10px]"></i> 新增進度`;
                    addBtn.onclick = (e) => showInlineInput(dateStr, e);

                    const inputContainer = document.createElement('div');
                    inputContainer.id = `input-container-${dateStr}`;
                    inputContainer.className = "min-w-[160px]";

                    taskListContainer.appendChild(inputContainer);
                    taskListContainer.appendChild(addBtn);

                    cellEl.appendChild(sideHeader);
                    cellEl.appendChild(taskListContainer);
                }

                grid.appendChild(cellEl);
            });

            grid.className = state.viewMode === 'week' ? "grid grid-cols-1 gap-2 flex-1" : "grid grid-cols-7 gap-2 flex-1 min-h-[520px]";
        }

        window.onload = function() {
            initStorage();
            renderCalendar();
        };
    </script>
</body>
</html>
